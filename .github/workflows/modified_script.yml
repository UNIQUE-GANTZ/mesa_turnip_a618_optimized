name: Build Turnip A618 (Brute Force Mode)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-mako python3-yaml \
            libxml2-dev libelf-dev spirv-tools ninja-build glslang-tools \
            unzip wget

      - name: Update Meson
        run: |
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Inject Android Headers & Stubs
        run: |
          # 1. Scarichiamo gli header di Android che mancano nell'NDK (cutils, sync, log)
          # Usiamo un repository di header leggeri per build native
          wget https://github.com/K11MCH1/android-headers/archive/refs/heads/main.zip
          unzip main.zip
          
          # 2. Creiamo una cartella 'stubs' e copiamo gli header lì dentro
          mkdir -p $(pwd)/android-stubs/include
          cp -r android-headers-main/* $(pwd)/android-stubs/include/
          
          # 3. Creiamo i file pkg-config dentro la stessa cartella
          mkdir -p $(pwd)/android-stubs/pkgconfig
          for lib in libcutils libsync libhardware liblog; do
            cat <<EOF > $(pwd)/android-stubs/pkgconfig/${lib}.pc
          Name: ${lib}
          Description: Android ${lib} stub
          Version: 1.0
          Libs: -L${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/33 -lc
          Cflags: -I$(pwd)/android-stubs/include
          EOF
          done

      - name: Configure and Build
        run: |
          # Esportiamo i percorsi in modo che Meson DEBBA vederli
          export PKG_CONFIG_PATH=$(pwd)/android-stubs/pkgconfig
          export CFLAGS="-I$(pwd)/android-stubs/include $CFLAGS"
          export CPPFLAGS="-I$(pwd)/android-stubs/include $CPPFLAGS"

          # Creazione cross-file
          cat <<EOF > android-a64.txt
          [binaries]
          c = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang'
          cpp = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++'
          ar = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = '/usr/bin/pkg-config'
          glslangValidator = '/usr/bin/glslangValidator'

          [properties]
          # Forziamo Meson a cercare i pacchetti nella nostra cartella stub
          pkg_config_libdir = '$(pwd)/android-stubs/pkgconfig'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          meson setup build_android --cross-file android-a64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dgallium-drivers="" \
            -Dbuildtype=release \
            -Dandroid-libbacktrace=disabled \
            -Dandroid-strict=false \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled

          ninja -C build_android src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A618-SuperFixed
          path: build_android/src/freedreno/vulkan/libvulkan_freedreno.so
