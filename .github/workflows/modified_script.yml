name: Build Turnip A618 Docker Takeover
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Usiamo un'immagine professionale per lo sviluppo Android (Android SDK + NDK)
    container:
      image: mingchen/android-build:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          apt-get update && apt-get install -y \
            python3-pip python3-setuptools python3-mako python3-yaml \
            libxml2-dev libelf-dev spirv-tools ninja-build glslang-tools \
            gettext git meson pkg-config

      - name: Locate NDK & Libraries
        run: |
          # Individuiamo dove Android tiene i suoi header in questo container
          # Solitamente: /opt/android-sdk/ndk/<versione>/sysroot
          export NDK_PATH=$(find /opt -name "ndk" -type d | head -n 1)
          echo "NDK_FOUND=$NDK_PATH" >> $GITHUB_ENV

      - name: Create Pkg-Config for Android OS
        run: |
          mkdir -p stubs/pkgconfig
          # In un ambiente Android reale, gralloc e cutils sono "fantasmi" 
          # che Mesa deve linkare. Creiamo gli stub per fargli saltare il controllo.
          for lib in cutils hardware sync log nativewindow libdrm expat zlib; do
            cat <<EOF > stubs/pkgconfig/${lib}.pc
          Name: ${lib}
          Description: Android System Library
          Version: 33
          Libs: -lc
          Cflags: -I/usr/include
          EOF
          done

      - name: Configure Mesa
        run: |
          # Troviamo il compilatore clang specifico per Android nel container
          CLANG_PATH=$(find /opt -name "aarch64-linux-android33-clang" | head -n 1)
          
          cat <<EOF > android-a64.txt
          [binaries]
          c = '$CLANG_PATH'
          cpp = '${CLANG_PATH}++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = '/usr/bin/pkg-config'

          [properties]
          pkg_config_libdir = '$(pwd)/stubs/pkgconfig'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # Patch per ignorare gralloc se manca
          find . -name "meson.build" -exec sed -i "s/required : true/required : false/g" {} +

          meson setup build_android --cross-file android-a64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dgallium-drivers="" \
            -Dbuildtype=release \
            -Dandroid-libbacktrace=disabled \
            -Dllvm=disabled \
            -Dwrap_mode=nofallback

      - name: Build
        run: |
          ninja -C build_android src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A618-Docker-Takeover
          path: build_android/src/freedreno/vulkan/libvulkan_freedreno.so
