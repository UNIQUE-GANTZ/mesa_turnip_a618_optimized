name: Build Turnip A618 (Preemptive Strike Mode)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-mako python3-yaml \
            libxml2-dev libelf-dev spirv-tools ninja-build glslang-tools

      - name: Update Meson
        run: |
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Preemptive Fixes (Cutils, Hardware, Sync, Log)
        run: |
          # 1. Creiamo gli HEADER minimi per ingannare il compilatore C++
          mkdir -p stubs/include/cutils stubs/include/hardware stubs/include/android stubs/include/system
          
          # Stub per cutils/native_handle.h
          cat <<EOF > stubs/include/cutils/native_handle.h
          #ifndef NATIVE_HANDLE_H
          #define NATIVE_HANDLE_H
          typedef struct native_handle { int version; int numFds; int numInts; int data[0]; } native_handle_t;
          #endif
          EOF

          # Stub per hardware/hardware.h e gralloc.h (spesso richiesti)
          touch stubs/include/hardware/hardware.h
          touch stubs/include/hardware/gralloc.h
          
          # Stub per log/log.h
          cat <<EOF > stubs/include/android/log.h
          #ifndef ANDROID_LOG_H
          #define ANDROID_LOG_H
          #define ALOGE(...) ((void)0)
          #define ALOGW(...) ((void)0)
          #define ALOGD(...) ((void)0)
          #define ALOGI(...) ((void)0)
          #define ALOGV(...) ((void)0)
          #endif
          EOF
          cp stubs/include/android/log.h stubs/include/log/log.h || mkdir -p stubs/include/log && cp stubs/include/android/log.h stubs/include/log/log.h

          # 2. Creiamo i file PKG-CONFIG per ingannare Meson
          mkdir -p stubs/pkgconfig
          for lib in libcutils libhardware libsync liblog libbacktrace; do
            cat <<EOF > stubs/pkgconfig/${lib}.pc
          Name: ${lib}
          Description: Android ${lib} stub
          Version: 1.0
          Libs: -L${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/33 -lc
          Cflags: -I$(pwd)/stubs/include
          EOF
          done

          # 3. PATCH NUCLEARE: Disabilitiamo i controlli nel codice sorgente
          # Trasformiamo ogni richiesta di queste librerie in 'non obbligatoria'
          find . -name "meson.build" -exec sed -i "s/dependency('cutils'/dependency('cutils', required : false/g" {} +
          find . -name "meson.build" -exec sed -i "s/dependency('hardware'/dependency('hardware', required : false/g" {} +
          find . -name "meson.build" -exec sed -i "s/dependency('libsync'/dependency('libsync', required : false/g" {} +
          find . -name "meson.build" -exec sed -i "s/dependency('log'/dependency('log', required : false/g" {} +

      - name: Configure and Build
        run: |
          export PKG_CONFIG_PATH=$(pwd)/stubs/pkgconfig
          export CFLAGS="-I$(pwd)/stubs/include"
          export CPPFLAGS="-I$(pwd)/stubs/include"

          cat <<EOF > android-a64.txt
          [binaries]
          c = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang'
          cpp = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++'
          ar = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = '/usr/bin/pkg-config'
          glslangValidator = '/usr/bin/glslangValidator'

          [properties]
          pkg_config_libdir = '$(pwd)/stubs/pkgconfig'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          meson setup build_android --cross-file android-a64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dgallium-drivers="" \
            -Dbuildtype=release \
            -Dandroid-libbacktrace=disabled \
            -Dandroid-strict=false \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled \
            -Db_lto=false

          ninja -C build_android src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A618-FullFixed
          path: build_android/src/freedreno/vulkan/libvulkan_freedreno.so
