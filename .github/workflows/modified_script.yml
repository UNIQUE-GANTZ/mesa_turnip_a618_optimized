name: Build Turnip A618 Docker Fixed
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # Questa immagine è specifica per compilare Turnip/Mesa per Android
      image: k11mch1/mesa-android-build:latest 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure and Build
        run: |
          # In questa immagine, l'NDK è già configurato nel PATH
          # Creiamo il cross-file minimale
          cat <<EOF > docker-android-a64.txt
          [binaries]
          c = 'aarch64-linux-android33-clang'
          cpp = 'aarch64-linux-android33-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # Setup Meson
          # Nota: In Docker spesso non serve specificare tutto perché l'ambiente è già pronto
          meson setup build_android --cross-file docker-android-a64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dgallium-drivers="" \
            -Dbuildtype=release \
            -Dandroid-libbacktrace=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dllvm=disabled

          ninja -C build_android src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A618-Docker-OK
          path: build_android/src/freedreno/vulkan/libvulkan_freedreno.so
