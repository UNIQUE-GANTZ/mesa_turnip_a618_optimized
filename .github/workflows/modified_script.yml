name: Build Turnip A618 (Force Cutils Stub)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-mako python3-yaml \
            libxml2-dev libelf-dev spirv-tools ninja-build glslang-tools

      - name: Update Meson
        run: |
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Create Android Stubs (The Fix)
        run: |
          # Creiamo dei finti file .pc (package config) per convincere Meson che cutils esiste
          mkdir -p pkgconfig
          
          cat <<EOF > pkgconfig/libcutils.pc
          Name: libcutils
          Description: Android cutils stub
          Version: 1.0
          Libs: -L${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/33 -lc
          Cflags: -I${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include
          EOF
          
          # Copiamo lo stesso trucco per altre librerie che rompono spesso (sync, hardware, log)
          cp pkgconfig/libcutils.pc pkgconfig/libsync.pc
          cp pkgconfig/libcutils.pc pkgconfig/libhardware.pc
          cp pkgconfig/libcutils.pc pkgconfig/liblog.pc
          
          echo "PKG_CONFIG_PATH=$(pwd)/pkgconfig" >> $GITHUB_ENV

      - name: Configure and Build
        run: |
          # Creazione cross-file
          cat <<EOF > android-a64.txt
          [binaries]
          c = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang'
          cpp = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++'
          ar = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = '/usr/bin/pkg-config'
          glslangValidator = '/usr/bin/glslangValidator'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # Eseguiamo il setup puntando alla nostra cartella pkgconfig personalizzata
          export PKG_CONFIG_PATH=$(pwd)/pkgconfig
          
          meson setup build_android --cross-file android-a64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dgallium-drivers="" \
            -Dbuildtype=release \
            -Dandroid-libbacktrace=disabled \
            -Dandroid-strict=false \
            -Db_lto=false

          ninja -C build_android src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A618-Driver-Fixed
          path: build_android/src/freedreno/vulkan/libvulkan_freedreno.so
