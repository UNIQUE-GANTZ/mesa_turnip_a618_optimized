name: Build Turnip A618 (Sed Patch Mode)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-mako python3-yaml \
            libxml2-dev libelf-dev spirv-tools ninja-build glslang-tools

      - name: Update Meson
        run: |
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Nuclear Patch (Remove Cutils Dependency)
        run: |
          # Questo comando cerca la riga che contiene 'cutils' nel file meson.build 
          # e la trasforma in una dipendenza vuota/non richiesta.
          find . -name "meson.build" -exec sed -i "s/dependency('cutils'/dependency('cutils', required : false/g" {} +
          find . -name "meson.build" -exec sed -i "s/dep_cutils = .*/dep_cutils = []/g" {} +
          
          # Creiamo comunque gli header minimi perché il codice C potrebbe cercarli
          mkdir -p stubs/include/cutils
          cat <<EOF > stubs/include/cutils/native_handle.h
          #ifndef NATIVE_HANDLE_H
          #define NATIVE_HANDLE_H
          typedef struct native_handle { int version; int numFds; int numInts; int data[0]; } native_handle_t;
          #endif
          EOF

      - name: Configure and Build
        run: |
          # Creazione cross-file
          cat <<EOF > android-a64.txt
          [binaries]
          c = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang'
          cpp = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++'
          ar = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = '/usr/bin/pkg-config'
          glslangValidator = '/usr/bin/glslangValidator'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # Aggiungiamo i nostri stub al percorso di inclusione
          export CFLAGS="-I$(pwd)/stubs/include"
          export CPPFLAGS="-I$(pwd)/stubs/include"

          meson setup build_android --cross-file android-a64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dgallium-drivers="" \
            -Dbuildtype=release \
            -Dandroid-libbacktrace=disabled \
            -Dandroid-strict=false \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled

          ninja -C build_android src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A618-Patched
          path: build_android/src/freedreno/vulkan/libvulkan_freedreno.so
