name: Build Turnip A618 via Docker
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Qui carichiamo il computer virtuale con tutto il necessario per Android
    container:
      image: registry.freedesktop.org/mesa/mesa/debian/android_build:2024-06-03-virgl

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure and Build with Meson
        run: |
          # 1. Definiamo i percorsi del NDK già presente nel container
          # Solitamente in queste immagini l'NDK è sotto /android-ndk o definito in variabili d'ambiente
          
          # 2. Creiamo un cross-file rapido che punta agli strumenti del container
          cat <<EOF > docker-android-a64.txt
          [binaries]
          c = 'aarch64-linux-android33-clang'
          cpp = 'aarch64-linux-android33-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # 3. Setup (Senza bisogno di stub, le librerie sono nel sistema del container)
          meson setup build_android --cross-file docker-android-a64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dgallium-drivers="" \
            -Dbuildtype=release \
            -Dandroid-libbacktrace=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dllvm=disabled \
            -Db_lto=false

          # 4. Compilazione
          ninja -C build_android src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A618-Docker-Build
          path: build_android/src/freedreno/vulkan/libvulkan_freedreno.so
