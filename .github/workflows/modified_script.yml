name: Build Turnip A618 Termux Takeover
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Questa immagine esiste, è pubblica e ha TUTTI i tool per compilare Mesa
    container:
      image: termux/package-builder:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Environment
        run: |
          # Installiamo solo le utility mancanti (il grosso è già nel container)
          apt-get update
          apt-get install -y python3-pip python3-mako python3-yaml ninja-build pkg-config
          pip3 install --upgrade meson

      - name: Fake Android System Headers
        run: |
          # Termux ha le sue librerie in percorsi strani. 
          # Creiamo uno stub ultra-veloce per i requisiti minimi di Mesa.
          mkdir -p stubs/pkgconfig
          for lib in cutils hardware sync log nativewindow android; do
            cat <<EOF > stubs/pkgconfig/${lib}.pc
          Name: ${lib}
          Description: Termux Fake Android
          Version: 33
          Libs: -lc
          Cflags: -I/usr/include
          EOF
          done

      - name: Configure and Build
        run: |
          export PKG_CONFIG_PATH=$(pwd)/stubs/pkgconfig
          
          # Creiamo un cross-file che usa il compilatore interno del container
          # N.B. In questo container il target è aarch64-linux-android
          cat <<EOF > termux-a64.txt
          [binaries]
          c = 'aarch64-linux-android-clang'
          cpp = 'aarch64-linux-android-clang++'
          ar = 'llvm-ar'
          strip = 'llvm-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # Patch per rendere tutto opzionale
          find . -name "meson.build" -exec sed -i "s/required : true/required : false/g" {} +

          meson setup build_android --cross-file termux-a64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dgallium-drivers="" \
            -Dbuildtype=release \
            -Dandroid-libbacktrace=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dllvm=disabled \
            -Dwrap_mode=nofallback

          # Compiliamo solo il driver vulkan
          ninja -C build_android src/freedreno/vulkan/libvulkan_freedreno.so

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-A618-Termux-Build
          path: build_android/src/freedreno/vulkan/libvulkan_freedreno.so
