name: Build Turnip A618 (Sync Exterminator)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip python3-setuptools python3-mako python3-yaml \
            libxml2-dev libelf-dev spirv-tools ninja-build glslang-tools

      - name: Update Meson
        run: |
          pip3 install --user --upgrade meson
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Preemptive Fixes & Sync Removal
        run: |
          # 1. Creiamo gli HEADER minimi (Stub)
          mkdir -p stubs/include/cutils stubs/include/hardware stubs/include/android stubs/include/log stubs/include/sync
          
          # Stub per sync/sync.h (Quello che ti sta bloccando ora)
          cat <<EOF > stubs/include/sync/sync.h
          #ifndef SYNC_H
          #define SYNC_H
          static inline int sync_wait(int fd, int timeout) { return 0; }
          static inline int sync_merge(const char *name, int fd1, int fd2) { return -1; }
          #endif
          EOF

          # Stub per cutils/native_handle.h
          cat <<EOF > stubs/include/cutils/native_handle.h
          #ifndef NATIVE_HANDLE_H
          #define NATIVE_HANDLE_H
          typedef struct native_handle { int version; int numFds; int numInts; int data[0]; } native_handle_t;
          #endif
          EOF

          # Stub per log/log.h
          cat <<EOF > stubs/include/android/log.h
          #ifndef ANDROID_LOG_H
          #define ANDROID_LOG_H
          #define ALOGE(...) ((void)0)
          #endif
          EOF
          cp stubs/include/android/log.h stubs/include/log/log.h

          # 2. Creiamo i file PKG-CONFIG (per convincere Meson che le librerie esistono)
          mkdir -p stubs/pkgconfig
          for lib in libcutils libhardware libsync sync liblog; do
            cat <<EOF > stubs/pkgconfig/${lib}.pc
          Name: ${lib}
          Description: Android ${lib} stub
          Version: 1.0
          Libs: -lc
          Cflags: -I$(pwd)/stubs/include
          EOF
          done

          # 3. PATCH TOTALE: Rimuoviamo ogni "required: true" per queste dipendenze
          # Cerchiamo tutte
