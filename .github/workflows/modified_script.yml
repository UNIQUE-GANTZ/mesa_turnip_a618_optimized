- name: Nuclear Patch & Stubbing (Cutils Force Fix)
        run: |
          # 1. Creazione cartelle (inclusi percorsi multipli per cutils)
          mkdir -p stubs/include/android stubs/include/log stubs/include/cutils stubs/include/hardware stubs/include/sync stubs/include/libdrm stubs/include/udev
          
          # 2. Stub Header - FORZIAMO CUTILS
          cat <<EOF > stubs/include/cutils/native_handle.h
          #ifndef NATIVE_HANDLE_H
          #define NATIVE_HANDLE_H
          #ifdef __cplusplus
          extern "C" {
          #endif
          typedef struct native_handle {
              int version;        /* sizeof(native_handle_t) */
              int numFds;         /* number of file-descriptors at &data[0] */
              int numInts;        /* number of ints at &data[numFds] */
              int data[0];        /* numFds + numInts ints */
          } native_handle_t;
          #ifdef __cplusplus
          }
          #endif
          #endif
          EOF

          # Altri header necessari
          echo "#ifndef SYNC_H #define SYNC_H #include <unistd.h> static inline int sync_wait(int fd, int timeout) { return 0; } #endif" > stubs/include/sync/sync.h
          echo "#ifndef _DRM_H_ #define _DRM_H_ #include <stdint.h> typedef unsigned int drm_handle_t; #endif" > stubs/include/libdrm/drm.h
          touch stubs/include/android/native_window.h
          touch stubs/include/hardware/hardware.h
          touch stubs/include/udev/libudev.h

          # 3. Creazione file PKG-CONFIG (Raddoppiamo i nomi per sicurezza)
          mkdir -p stubs/pkgconfig
          # Ho aggiunto sia 'cutils' che 'libcutils'
          for lib in cutils libcutils hardware libhardware sync libsync log liblog backtrace libbacktrace unwind libunwind zlib libelf nativewindow libnativewindow android libdrm vulkan libudev spirv-tools; do
            cat <<EOF > stubs/pkgconfig/${lib}.pc
          Name: ${lib}
          Description: Android ${lib} stub
          Version: 99.0
          Libs: -lc
          Cflags: -I$(pwd)/stubs/include
          EOF
          done

          # 4. Patch dei file Meson (Ancora più aggressiva)
          find . -name "meson.build" -exec sed -i "s/required : true/required : false/g" {} +
